name: Sync CleverTap Stats

on:
  workflow_dispatch:
    inputs:
      vertical:
        description: 'Vertical(s) to run (e.g., Day0, Day5, Day15, Concierge, WhatsApp, SMS. Leave blank to run all)'
        required: false
        default: ''
      date:
        description: 'Date to run (YYYY-MM-DD format. Leave blank for today)'
        required: false
        default: ''
      cumulative:
        description: 'Sum counts across the date range instead of writing daily rows'
        type: boolean
        required: false
        default: false

jobs:
  sync-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt python-dotenv --only-binary=:all:

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Create service_account.json
        run: |
          echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run Stats Sync Script
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_VERTICAL: ${{ github.event.inputs.vertical }}
          INPUT_CUMULATIVE: ${{ github.event.inputs.cumulative }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CLEVERTAP_EMAIL: ${{ secrets.CLEVERTAP_EMAIL }}
          CLEVERTAP_PASSWORD: ${{ secrets.CLEVERTAP_PASSWORD }}
          CLEVERTAP_TOTP_SECRET: ${{ secrets.CLEVERTAP_TOTP_SECRET }}
          CT_BASE_URL: ${{ secrets.CT_BASE_URL }}
          CT_REFERER_URL: ${{ secrets.CT_REFERER_URL }}
          CT_COOKIE: ${{ secrets.CT_COOKIE }}
          CT_CSRF_TOKEN: ${{ secrets.CT_CSRF_TOKEN }}
          SERVICE_ACCOUNT_FILE: service_account.json
        run: |
          ARGS=()
          if [ -n "$INPUT_DATE" ]; then
            ARGS+=("--date" "$INPUT_DATE")
          fi
          if [ -n "$INPUT_VERTICAL" ]; then
            ARGS+=("--tabs" "$INPUT_VERTICAL")
          fi
          if [ "$INPUT_CUMULATIVE" = "true" ]; then
            ARGS+=("--cumulative")
          fi
          
          python clevertap_stats.py "${ARGS[@]}"
